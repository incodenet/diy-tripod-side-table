name: Build standalone HTML

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone HTML
        run: npm run build

      - name: Validate standalone HTML
        run: npm run validate:standalone

      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: standalone-app
          path: dist/index.html
          if-no-files-found: error
